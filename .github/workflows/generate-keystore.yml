name: Generate Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate debug.keystore and convert to Base64
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > debug-keystore-base64.txt

      - name: Upload Base64 Text Artifact
        uses: actions/upload-artifact@v6
        with:
          name: keystore-base64
          path: debug-keystore-base64.txt
